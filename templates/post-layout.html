<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} | {{siteName}}</title>
    <meta name="description" content="{{description}}">
    
    <!-- Open Graph -->
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:image" content="{{image}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{url}}">

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .post-content { max-width: 800px; margin: 4rem auto; padding: 0 20px; }
        .post-header { text-align: center; margin-bottom: 4rem; }
        .post-image { width: 100%; border-radius: 12px; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <header class="s-header">
        <div class="header-logo"><a href="/index.html">{{siteName}}</a></div>
    </header>

    <main class="post-content">
        <header class="post-header">
            <h1>{{title}}</h1>
            <p class="date">{{date}}</p>
        </header>

        {{#if image}}
        <img src="{{image}}" alt="{{title}}" class="post-image">
        {{/if}}

        <div class="content">
            {{{body}}}
        </div>

        {{#if treatment}}
        <section class="medical-data">
            <h2>Tratamiento</h2>
            <div>{{{treatment}}}</div>
            <h2>Evolución</h2>
            <div>{{{evolution}}}</div>
        </section>
        {{/if}}

        <div style="margin-top: 4rem;">
            <a href="javascript:history.back()" class="btn btn--primary">Volver</a>
        </div>
    </main>

    <footer>
        <div class="row">
            <div class="col-full">
                <span>© {{siteName}} {{year}}</span>
            </div>
        </div>
    </footer>
</body>
</html>
